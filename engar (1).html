<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathAR - Hand Tracking Math Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Mitr', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Fallback dark bg */
            touch-action: none; /* Prevent scroll on touch */
            user-select: none;
        }
        
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror camera */
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        /* Glassmorphism UI Elements */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Timer Critical Pulse Animation */
        @keyframes timerPulse {
            0%, 100% { transform: scale(1); color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }
            50% { transform: scale(1.15); color: #f87171; text-shadow: 0 0 25px rgba(239, 68, 68, 1); }
        }

        .timer-critical {
            animation: timerPulse 0.8s infinite ease-in-out;
            font-weight: 800 !important;
        }

        /* Floating Combo Badge Animation */
        @keyframes comboPop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .combo-badge {
            animation: comboPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Start & End Screen specific */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #4c1d95 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            transition: opacity 0.5s;
        }

        #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            pointer-events: auto;
            transition: opacity 0.5s;
        }

        #loading-text {
            display: none;
            color: white;
            margin-top: 1rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- Video Background -->
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <div id="ui-layer" class="p-4 sm:p-6 hidden">
        <div class="flex justify-between items-start w-full gap-2">
            <!-- Score & Combo Container -->
            <div class="flex flex-col gap-2">
                <div id="score-board" class="glass-panel text-white px-5 py-2.5 rounded-2xl text-xl sm:text-2xl font-semibold flex items-center gap-2">
                    <span>คะแนน:</span>
                    <span id="score-val" class="text-yellow-400 font-bold">0</span>
                </div>
                <div id="combo-container" class="hidden">
                    <span id="combo-badge" class="combo-badge inline-block bg-gradient-to-r from-amber-500 to-red-500 text-white font-extrabold text-sm sm:text-base px-3 py-1 rounded-full shadow-lg border border-yellow-300">
                        🔥 COMBO x<span id="combo-val">1</span>!
                    </span>
                </div>
            </div>
            
            <!-- Timer Display Panel -->
            <div id="timer-board" class="glass-panel text-white px-6 py-2 rounded-2xl text-2xl sm:text-3xl font-bold flex items-center justify-center min-w-[130px] border border-white/40">
                <span id="timer-icon" class="mr-2">⏱️</span>
                <span id="timer-val" class="text-cyan-300 font-mono">60</span>
            </div>

            <!-- Hand Tracking Status & Navigation Button -->
            <div class="flex items-center gap-3">
                <div id="hand-warning" class="bg-red-500/80 text-white px-4 py-2 rounded-full font-medium text-sm shadow-lg transition-opacity duration-300 opacity-0 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <span class="hidden sm:inline">กำลังหามือ...</span>
                </div>

                <button id="btn-ingame-home" class="glass-panel text-white hover:bg-white/20 px-4 py-2.5 rounded-2xl text-base font-medium flex items-center gap-2 pointer-events-auto transition hover:scale-105 active:scale-95 border border-white/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="hidden sm:inline">หน้าแรก</span>
                </button>
            </div>
        </div>

        <div class="flex justify-center mb-6 sm:mb-10 mt-auto">
            <div id="question-board" class="glass-panel text-white text-2xl sm:text-4xl md:text-5xl font-bold px-8 py-3 rounded-3xl shadow-2xl border-b-4 border-white/40 text-center">
                <!-- โจทย์จะแสดงที่นี่ -->
            </div>
        </div>
    </div>

    <div id="end-screen" class="hidden flex flex-col items-center justify-center p-4">
        <div class="glass-panel p-8 md:p-12 rounded-3xl text-center max-w-lg w-full border border-white/30 shadow-2xl transform transition scale-100">
            <div id="end-title-icon" class="text-6xl mb-3">🏆</div>
            <h1 id="end-title-text" class="text-3xl md:text-5xl font-bold text-white mb-1 drop-shadow-lg">หมดเวลา!</h1>
            <p id="end-subtitle" class="text-xl text-yellow-300 font-semibold mb-6">สรุปผลการแข่งขันของคุณ</p>
            
            <div class="bg-white/10 rounded-2xl p-5 mb-6 border border-white/20 flex flex-col gap-3">
                <div>
                    <p class="text-sm text-blue-200 mb-0.5">คะแนนรวมทั้งหมด</p>
                    <span id="final-score" class="text-5xl md:text-6xl font-extrabold text-amber-400 drop-shadow">0</span>
                    <span class="text-xl text-white font-medium"> คะแนน</span>
                </div>
                
                <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/10 text-center">
                    <div class="bg-white/5 p-2.5 rounded-xl border border-white/10">
                        <p class="text-xs text-blue-200">ตอบถูกต้อง</p>
                        <p id="stat-solved" class="text-xl font-bold text-green-400">0 ข้อ</p>
                    </div>
                    <div class="bg-white/5 p-2.5 rounded-xl border border-white/10">
                        <p class="text-xs text-blue-200">คอมโบสูงสุด</p>
                        <p id="stat-max-combo" class="text-xl font-bold text-amber-300">x0</p>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button id="btn-replay" class="bg-gradient-to-r from-green-400 to-emerald-600 hover:from-green-500 hover:to-emerald-700 text-white text-lg font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    เล่นอีกครั้ง
                </button>
                <button id="btn-home" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white text-lg font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center justify-center gap-2 border border-white/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    กลับไปหน้าแรก
                </button>
            </div>
        </div>
    </div>

    <div id="start-screen">
        <div class="glass-panel p-8 sm:p-12 rounded-3xl text-center max-w-xl w-11/12 border border-white/30 shadow-2xl">
            <h1 class="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-amber-300 to-pink-400 mb-2 drop-shadow-lg">MathAR</h1>
            <p class="text-lg sm:text-xl text-blue-100 mb-8 font-light">เกมฝึกทักษะคณิตศาสตร์ AR แบบโต้ตอบด้วยมือ!</p>
            
            <!-- Step 1: Select Input Mode -->
            <div id="step-mode-selection" class="flex flex-col gap-4 w-full items-center">
                <button id="start-btn" class="w-full max-w-sm bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white text-xl font-semibold py-3.5 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                    <span>📷</span> เล่นด้วยกล้อง AR (MediaPipe)
                </button>
                <button id="mouse-btn" class="w-full max-w-sm bg-white/20 hover:bg-white/30 text-white text-lg font-semibold py-3 px-8 rounded-full shadow-lg transform transition border border-white/40 hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                    <span>🖱️</span> เล่นด้วยเมาส์ / สัมผัส (No Camera)
                </button>
            </div>

            <!-- Step 2: Select Timer Option -->
            <div id="step-timer-selection" class="hidden flex flex-col gap-3 w-full items-center">
                <h2 class="text-xl sm:text-2xl text-white font-bold mb-1">⏱️ เลือกระยะเวลาจับเวลา</h2>
                <div class="grid grid-cols-2 gap-3 w-full max-w-md">
                    <button class="btn-timer bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 px-4 rounded-2xl shadow-lg border border-white/20 hover:scale-105 transition" data-time="30">
                        ⚡ 30 วินาที<br><span class="text-xs text-cyan-200 font-normal">(Time Attack)</span>
                    </button>
                    <button class="btn-timer bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-2xl shadow-lg border border-white/20 hover:scale-105 transition" data-time="60">
                        ⏱️ 60 วินาที<br><span class="text-xs text-blue-200 font-normal">(มาตรฐาน)</span>
                    </button>
                    <button class="btn-timer bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-2xl shadow-lg border border-white/20 hover:scale-105 transition" data-time="90">
                        ⏳ 90 วินาที<br><span class="text-xs text-indigo-200 font-normal">(ผ่อนคลาย)</span>
                    </button>
                    <button class="btn-timer bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 px-4 rounded-2xl shadow-lg border border-white/20 hover:scale-105 transition" data-time="0">
                        ♾️ ไม่จำกัดเวลา<br><span class="text-xs text-purple-200 font-normal">(Infinity)</span>
                    </button>
                </div>
            </div>

            <!-- Step 3: Select Difficulty Option -->
            <div id="step-difficulty-selection" class="hidden flex flex-col gap-3 w-full items-center">
                <h2 class="text-xl sm:text-2xl text-white font-bold mb-1">🎯 เลือกระดับความยาก</h2>
                <button id="btn-easy" class="w-full max-w-sm bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white text-lg font-semibold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">ง่าย (บวก / ลบ พื้นฐาน)</button>
                <button id="btn-medium" class="w-full max-w-sm bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white text-lg font-semibold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">ปานกลาง (คูณ / หาร)</button>
                <button id="btn-hard" class="w-full max-w-sm bg-gradient-to-r from-red-500 to-rose-700 hover:from-red-600 hover:to-rose-800 text-white text-lg font-semibold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">ยาก (สมการ / เลขหลายหลัก)</button>
            </div>

            <div id="loading-text" class="text-base mt-4 hidden text-cyan-300 font-medium">กำลังเปิดกล้องและระบบปัญญาประดิษฐ์...</div>
        </div>
    </div>

    <script>
        // DOM Elements Reference
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('webcam');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const startBtn = document.getElementById('start-btn');
        const mouseBtn = document.getElementById('mouse-btn');
        const loadingText = document.getElementById('loading-text');
        const uiLayer = document.getElementById('ui-layer');
        const scoreVal = document.getElementById('score-val');
        const finalScore = document.getElementById('final-score');
        const questionBoard = document.getElementById('question-board');
        const handWarning = document.getElementById('hand-warning');
        const btnReplay = document.getElementById('btn-replay');
        const btnHome = document.getElementById('btn-home');
        const btnIngameHome = document.getElementById('btn-ingame-home');
        
        // Timer & Stat UI Elements
        const timerBoard = document.getElementById('timer-board');
        const timerVal = document.getElementById('timer-val');
        const comboContainer = document.getElementById('combo-container');
        const comboVal = document.getElementById('combo-val');
        const statSolved = document.getElementById('stat-solved');
        const statMaxCombo = document.getElementById('stat-max-combo');
        const endTitleIcon = document.getElementById('end-title-icon');
        const endTitleText = document.getElementById('end-title-text');

        // Navigation Menu Step Elements
        const stepModeSelection = document.getElementById('step-mode-selection');
        const stepTimerSelection = document.getElementById('step-timer-selection');
        const stepDifficultySelection = document.getElementById('step-difficulty-selection');
        const btnEasy = document.getElementById('btn-easy');
        const btnMedium = document.getElementById('btn-medium');
        const btnHard = document.getElementById('btn-hard');

        // Background Math Particle System
        let bgParticles = [];
        const bgSymbols = ['+', '−', '×', '÷', '=', '?', '1', '7', '8', '3', '4', '9', '★', '✦'];

        function initBackgroundParticles() {
            bgParticles = [];
            const count = 35;
            for (let i = 0; i < count; i++) {
                bgParticles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    symbol: bgSymbols[Math.floor(Math.random() * bgSymbols.length)],
                    size: Math.random() * 24 + 16,
                    speedY: (Math.random() * 0.8 + 0.2) * -1,
                    speedX: Math.random() * 0.6 - 0.3,
                    opacity: Math.random() * 0.35 + 0.1,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.02
                });
            }
        }

        function updateAndDrawParticles(ctx) {
            ctx.save();
            bgParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotSpeed;

                if (p.y < -30) p.y = height + 30;
                if (p.x < -30) p.x = width + 30;
                if (p.x > width + 30) p.x = -30;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                ctx.font = `bold ${p.size}px Mitr`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.symbol, 0, 0);
                ctx.restore();
            });
            ctx.restore();
        }

        // Game State Enum & Configuration
        const GameState = {
            START: 'START',
            INSTRUCT: 'INSTRUCT',
            PLAY: 'PLAY',
            END: 'END'
        };
        let currentState = GameState.START;
        let selectedDifficulty = 'EASY';
        let selectedTimerOption = 60; // default 60 sec
        let isInfiniteTimer = false;

        // Canvas Coordinates
        let width, height;
        
        // Input Variables (Mouse/Touch fallback + AR)
        let cursor = { x: 0, y: 0, state: 'NORMAL' }; // States: NORMAL, HOVER, MISS, GRAB
        let isPinching = false;
        let lastHandDetectTime = 0;
        let usingMouse = false;
        let mouseOnlyMode = false;
        let handLandmarksDraw = null;
        let selectedMode = 'AR';

        // Game Logic & Statistics Variables
        let currentLevel = 0;
        let score = 0;
        let maxLevelsPerGame = 50; // Unlimited flow for timer mode
        let levelData = [];
        let questionsSolved = 0;
        let currentCombo = 0;
        let maxCombo = 0;
        let questionStartTime = 0;
        
        // Countdown Timer Interval Reference
        let gameTimerInterval = null;
        let timeRemaining = 60;

        const emojis = ["🍎", "🍌", "🍇", "🌟", "🌙", "☀️", "🚗", "🚕", "🚙", "🐶", "🐱", "🐭", "🍔", "🍕", "🌭", "⚽", "🏀", "🏈", "🎸", "🎹", "🥁", "🚀", "🛸", "🚁", "🌈", "🌧️", "❄️", "📚", "✏️", "🎒"];
        
        function getRandomEmoji() {
            return emojis[Math.floor(Math.random() * emojis.length)];
        }

        function generateMathProblem(difficulty) {
            let num1, num2, answer, equationDisplay;
            let operators;
            
            if (difficulty === 'EASY') {
                operators = ['+', '-'];
                let op = operators[Math.floor(Math.random() * operators.length)];
                if (op === '+') {
                    num1 = Math.floor(Math.random() * 15) + 1;
                    num2 = Math.floor(Math.random() * 15) + 1;
                    answer = num1 + num2;
                } else {
                    num1 = Math.floor(Math.random() * 20) + 5;
                    num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
                    answer = num1 - num2;
                }
                
                let blankPos = Math.random();
                if (blankPos < 0.25) { equationDisplay = `_ ${op} ${num2} = ${answer}`; answer = num1; }
                else if (blankPos < 0.5) { equationDisplay = `${num1} ${op} _ = ${answer}`; answer = num2; }
                else { equationDisplay = `${num1} ${op} ${num2} = _`; }

            } else if (difficulty === 'MEDIUM') {
                operators = ['x', '÷', '+', '-'];
                let op = operators[Math.floor(Math.random() * operators.length)];
                if (op === 'x') {
                    num1 = Math.floor(Math.random() * 11) + 2; 
                    num2 = Math.floor(Math.random() * 11) + 2; 
                    answer = num1 * num2;
                } else if (op === '÷') {
                    num2 = Math.floor(Math.random() * 10) + 2;
                    answer = Math.floor(Math.random() * 10) + 2;
                    num1 = num2 * answer; 
                } else if (op === '+') {
                    num1 = Math.floor(Math.random() * 50) + 15;
                    num2 = Math.floor(Math.random() * 50) + 15;
                    answer = num1 + num2;
                } else {
                    num1 = Math.floor(Math.random() * 80) + 20;
                    num2 = Math.floor(Math.random() * (num1 - 5)) + 2;
                    answer = num1 - num2;
                }
                
                let blankPos = Math.random();
                if (blankPos < 0.3) { equationDisplay = `_ ${op} ${num2} = ${answer}`; answer = num1; }
                else if (blankPos < 0.6) { equationDisplay = `${num1} ${op} _ = ${answer}`; answer = num2; }
                else { equationDisplay = `${num1} ${op} ${num2} = _`; }

            } else {
                // HARD
                let isMixed = Math.random() > 0.5;
                if (isMixed) {
                    num1 = Math.floor(Math.random() * 10) + 3;
                    num2 = Math.floor(Math.random() * 10) + 3;
                    let num3 = Math.floor(Math.random() * 30) + 5;
                    let op1 = ['+', '-'][Math.floor(Math.random() * 2)];
                    
                    if (op1 === '+') {
                        answer = num1 * num2 + num3;
                        if(Math.random() > 0.5) {
                            equationDisplay = `${num1} × ${num2} + ${num3} = _`;
                        } else {
                            equationDisplay = `_ × ${num2} + ${num3} = ${answer}`;
                            answer = num1;
                        }
                    } else {
                        answer = num1 * num2 - num3;
                        if (answer < 0) { 
                            answer = num3 - num1 * num2; 
                            equationDisplay = `${num3} - ${num1} × ${num2} = _`; 
                        } else { 
                            equationDisplay = `${num1} × ${num2} - ${num3} = _`; 
                        }
                    }
                } else {
                    let ops = ['x', '÷', '+', '-'];
                    let op = ops[Math.floor(Math.random() * ops.length)];
                    if (op === 'x') {
                        num1 = Math.floor(Math.random() * 20) + 10;
                        num2 = Math.floor(Math.random() * 9) + 2; 
                        answer = num1 * num2;
                    } else if (op === '÷') {
                        num2 = Math.floor(Math.random() * 15) + 3;
                        answer = Math.floor(Math.random() * 20) + 10;
                        num1 = num2 * answer; 
                    } else if (op === '+') {
                        num1 = Math.floor(Math.random() * 400) + 100;
                        num2 = Math.floor(Math.random() * 400) + 100;
                        answer = num1 + num2;
                    } else {
                        num1 = Math.floor(Math.random() * 500) + 200;
                        num2 = Math.floor(Math.random() * (num1 - 50)) + 20;
                        answer = num1 - num2;
                    }
                    let blankPos = Math.random();
                    if (blankPos < 0.33) { equationDisplay = `_ ${op} ${num2} = ${answer}`; answer = num1; }
                    else if (blankPos < 0.66) { equationDisplay = `${num1} ${op} _ = ${answer}`; answer = num2; }
                    else { equationDisplay = `${num1} ${op} ${num2} = _`; }
                }
            }
            
            // Generate distinct wrong choices
            let ansStr = answer.toString();
            let c1, c2;
            do { c1 = (answer + Math.floor(Math.random() * 12) - 5).toString(); } while (c1 === ansStr || parseInt(c1) < 0);
            do { c2 = (answer + Math.floor(Math.random() * 20) - 9).toString(); } while (c2 === ansStr || c2 === c1 || parseInt(c2) < 0);
            
            return {
                equation: equationDisplay,
                slots: [ansStr],
                choices: [
                    { id: ansStr, emoji: getRandomEmoji() },
                    { id: c1, emoji: getRandomEmoji() },
                    { id: c2, emoji: getRandomEmoji() }
                ]
            };
        }

        // Card & Slot Classes
        let cards = [];
        let slots = [];
        let draggedCard = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let instructButton = null;

        class Card {
            constructor(wordObj, x, y, size) {
                this.word = wordObj.id;
                this.emoji = wordObj.emoji;
                this.x = x;
                this.y = y;
                this.width = size * 1.2;
                this.height = size * 1.5;
                this.isDragging = false;
                this.currentSlot = null;
                
                this.targetX = x;
                this.targetY = y;
            }

            draw(ctx) {
                if (!this.isDragging) {
                    this.x += (this.targetX - this.x) * 0.2;
                    this.y += (this.targetY - this.y) * 0.2;
                }

                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = this.isDragging ? 22 : 10;
                ctx.shadowOffsetX = this.isDragging ? 6 : 2;
                ctx.shadowOffsetY = this.isDragging ? 16 : 5;
                
                ctx.fillStyle = this.isDragging ? 'rgba(255, 255, 255, 0.98)' : 'rgba(255, 255, 255, 0.88)';
                
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 16);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 1)';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.restore();

                ctx.font = `${this.width * 0.38}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y - this.height * 0.15);

                ctx.fillStyle = '#1e293b';
                ctx.font = `700 ${this.width * 0.22}px Mitr`;
                ctx.fillText(this.word, this.x, this.y + this.height * 0.25);
            }

            isPointInside(px, py) {
                return px >= this.x - this.width/2 && px <= this.x + this.width/2 &&
                       py >= this.y - this.height/2 && py <= this.y + this.height/2;
            }
        }

        class Slot {
            constructor(expectedWord, x, y, width, height) {
                this.expectedWord = expectedWord;
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.card = null;
            }

            draw(ctx) {
                ctx.save();
                ctx.setLineDash([10, 10]);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 3;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 16);
                ctx.fill();
                ctx.stroke();
                
                ctx.restore();
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            width = canvas.width;
            height = canvas.height;
            initBackgroundParticles();
            
            if (currentState === GameState.INSTRUCT) {
                setupInstructionScreen();
            } else if (currentState === GameState.PLAY) {
                slots.forEach((s) => {
                    s.x = width / 2;
                    s.y = height * 0.75;
                    s.width = Math.min(width * 0.15, 140);
                    s.height = s.width * 1.5;
                    
                    if (s.card) {
                        s.card.targetX = s.x;
                        s.card.targetY = s.y;
                    }
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function setupInstructionScreen() {
            let btnWidth = Math.min(300, width * 0.5);
            let btnHeight = 70;
            instructButton = {
                x: width / 2,
                y: height / 2 + 110,
                width: btnWidth,
                height: btnHeight,
                isHover: false,
                draw: function(ctx) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                    ctx.beginPath();
                    let boxWidth = Math.min(750, width * 0.9);
                    ctx.roundRect(width/2 - boxWidth/2, height/2 - 210, boxWidth, 270, 24);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = 'white';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = `bold ${Math.min(34, width*0.04)}px Mitr`;
                    ctx.fillText("วิธีเล่น (How to Play)", width/2, height/2 - 165);
                    
                    ctx.font = `${Math.min(22, width*0.03)}px Mitr`;
                    ctx.fillText("👌 ใช้มือ 'จีบนิ้ว' (นิ้วโป้งแตะนิ้วชี้) เพื่อหยิบตัวเลขคำตอบ", width/2, height/2 - 110);
                    ctx.fillText("🖐️ 'กางนิ้ว' เพื่อวางคำตอบลงในช่องว่างของสมการ", width/2, height/2 - 65);
                    ctx.fillText("🖱️ สามารถใช้เมาส์ หรือ ทัชสกรีน ลากแทนได้ทุกโหมด", width/2, height/2 - 20);
                    
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 15;
                    ctx.shadowOffsetY = 5;
                    
                    ctx.fillStyle = this.isHover ? '#22c55e' : '#16a34a';
                    ctx.beginPath();
                    ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 35);
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.font = `bold ${Math.min(28, width*0.035)}px Mitr`;
                    ctx.shadowColor = 'transparent';
                    ctx.fillText("เริ่มเล่นเลย!", this.x, this.y);
                    
                    ctx.restore();
                },
                isPointInside: function(px, py) {
                    return px >= this.x - this.width/2 && px <= this.x + this.width/2 &&
                           py >= this.y - this.height/2 && py <= this.y + this.height/2;
                }
            };
        }

        function startTimerLogic() {
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            
            if (selectedTimerOption === 0) {
                isInfiniteTimer = true;
                timerBoard.classList.add('hidden');
                return;
            }
            
            isInfiniteTimer = false;
            timeRemaining = selectedTimerOption;
            timerVal.innerText = timeRemaining;
            timerBoard.classList.remove('hidden');
            timerVal.classList.remove('timer-critical');

            gameTimerInterval = setInterval(() => {
                if (currentState !== GameState.PLAY) return;

                timeRemaining--;
                timerVal.innerText = timeRemaining;

                if (timeRemaining <= 10 && timeRemaining > 0) {
                    timerVal.classList.add('timer-critical');
                }

                if (timeRemaining <= 0) {
                    clearInterval(gameTimerInterval);
                    triggerGameOver(false); // Time out
                }
            }, 1000);
        }

        function triggerGameOver(isAllCleared = false) {
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            currentState = GameState.END;
            
            finalScore.innerText = score;
            statSolved.innerText = `${questionsSolved} ข้อ`;
            statMaxCombo.innerText = `x${maxCombo}`;

            if (isAllCleared) {
                endTitleIcon.innerText = "🎉";
                endTitleText.innerText = "All Clear!";
                endTitleText.className = "text-3xl md:text-5xl font-bold text-yellow-300 mb-1 drop-shadow-lg";
            } else {
                endTitleIcon.innerText = "⏱️";
                endTitleText.innerText = "หมดเวลา!";
                endTitleText.className = "text-3xl md:text-5xl font-bold text-red-400 mb-1 drop-shadow-lg";
            }

            endScreen.classList.remove('hidden');
            endScreen.style.opacity = '1';
        }

        function loadLevel(levelIdx) {
            cards = [];
            slots = [];
            draggedCard = null;
            
            // Ensure dynamically generated math level available
            if (!levelData[levelIdx]) {
                levelData.push(generateMathProblem(selectedDifficulty));
            }

            const level = levelData[levelIdx];
            questionStartTime = Date.now();
            
            questionBoard.innerText = `ข้อที่ ${levelIdx + 1}: เติมตัวเลขที่หายไป`;
            questionBoard.classList.remove('hidden');
            
            let cardSize = Math.min(width * 0.15, 140);

            level.slots.forEach((expectedAnswer) => {
                slots.push(new Slot(expectedAnswer, width / 2, height * 0.75, cardSize, cardSize * 1.5));
            });

            let shuffledChoices = [...level.choices].sort(() => Math.random() - 0.5);
            let choiceSpacing = width / (shuffledChoices.length + 1);
            
            shuffledChoices.forEach((choice, i) => {
                let randX = choiceSpacing * (i + 1);
                let randY = height * 0.3 + (Math.random() * 40 - 20);
                
                let card = new Card(choice, randX, randY, cardSize * 0.85);
                cards.push(card);
            });
        }

        function checkCollisionsAndLogic() {
            if (currentState === GameState.INSTRUCT && instructButton) {
                let hoverBtn = instructButton.isPointInside(cursor.x, cursor.y);
                instructButton.isHover = hoverBtn;
                
                if (hoverBtn) {
                    cursor.state = isPinching ? 'GRAB' : 'HOVER';
                    if (isPinching) {
                        isPinching = false;
                        currentState = GameState.PLAY;
                        uiLayer.style.pointerEvents = 'none';
                        uiLayer.classList.remove('hidden');
                        startTimerLogic();
                        loadLevel(currentLevel);
                    }
                } else {
                    cursor.state = isPinching ? 'MISS' : 'NORMAL';
                }
                return;
            }

            if (currentState === GameState.PLAY) {
                if (isPinching) {
                    if (draggedCard) {
                        cursor.state = 'GRAB';
                        draggedCard.targetX = cursor.x + dragOffsetX;
                        draggedCard.targetY = cursor.y + dragOffsetY;
                        
                        if (draggedCard.currentSlot) {
                            draggedCard.currentSlot.card = null;
                            draggedCard.currentSlot = null;
                        }
                    } else {
                        for (let i = cards.length - 1; i >= 0; i--) {
                            let c = cards[i];
                            if (c.isPointInside(cursor.x, cursor.y)) {
                                draggedCard = c;
                                draggedCard.isDragging = true;
                                dragOffsetX = c.x - cursor.x;
                                dragOffsetY = c.y - cursor.y;
                                cursor.state = 'GRAB';
                                cards.splice(i, 1);
                                cards.push(draggedCard);
                                break;
                            }
                        }
                        if (!draggedCard) cursor.state = 'MISS';
                    }
                } else {
                    if (draggedCard) {
                        draggedCard.isDragging = false;
                        let snapped = false;
                        for (let slot of slots) {
                            if (!slot.card && 
                                Math.abs(draggedCard.x - slot.x) < slot.width && 
                                Math.abs(draggedCard.y - slot.y) < slot.height) {
                                
                                draggedCard.targetX = slot.x;
                                draggedCard.targetY = slot.y;
                                draggedCard.currentSlot = slot;
                                slot.card = draggedCard;
                                snapped = true;
                                break;
                            }
                        }
                        
                        draggedCard = null;
                        if (snapped) {
                             setTimeout(checkWinCondition, 250);
                        }
                    }
                    
                    let hoveringCard = cards.find(c => c.isPointInside(cursor.x, cursor.y));
                    cursor.state = hoveringCard ? 'HOVER' : 'NORMAL';
                }
            }
        }

        function checkWinCondition() {
            let isFull = slots.every(s => s.card !== null);
            if (!isFull) return;

            let isCorrect = slots.every(s => s.card && s.card.word === s.expectedWord);

            if (isCorrect) {
                // Calculation of Score with Combo & Time Bonus
                let timeTaken = (Date.now() - questionStartTime) / 1000;
                let speedBonus = Math.max(0, Math.floor((10 - timeTaken) * 10)); // Bonus if under 10 sec
                
                currentCombo++;
                if (currentCombo > maxCombo) maxCombo = currentCombo;
                
                let comboMultiplier = Math.min(3, 1 + (currentCombo - 1) * 0.2);
                let basePoints = 100;
                let earnedPoints = Math.floor((basePoints + speedBonus) * comboMultiplier);

                score += earnedPoints;
                questionsSolved++;
                scoreVal.innerText = score;

                // Update UI Combo
                if (currentCombo > 1) {
                    comboVal.innerText = currentCombo;
                    comboContainer.classList.remove('hidden');
                }

                slots.forEach(s => s.card.emoji = "✅");

                setTimeout(() => {
                    currentLevel++;
                    loadLevel(currentLevel);
                }, 1200);
            } else {
                // Incorrect Answer: Reset Combo Streak
                currentCombo = 0;
                comboContainer.classList.add('hidden');

                slots.forEach(s => {
                    if (s.card && s.card.word !== s.expectedWord) {
                        let c = s.card;
                        s.card = null;
                        c.currentSlot = null;
                        c.targetY = height * 0.3;
                        c.emoji = "❌";
                        setTimeout(() => {
                            let originalChoice = levelData[currentLevel].choices.find(ch => ch.id === c.word);
                            if (originalChoice) c.emoji = originalChoice.emoji;
                        }, 800);
                    }
                });
            }
        }

        function drawCursor() {
            ctx.save();
            ctx.translate(cursor.x, cursor.y);
            
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            
            if (cursor.state === 'NORMAL') {
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.8)';
                ctx.lineWidth = 3;
                ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
                ctx.fill();
                ctx.stroke();
            } else if (cursor.state === 'HOVER') {
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = 'rgba(234, 179, 8, 1)';
                ctx.lineWidth = 3.5;
                ctx.fillStyle = 'rgba(234, 179, 8, 0.25)';
                ctx.fill();
                ctx.stroke();
            } else if (cursor.state === 'MISS') {
                ctx.strokeStyle = 'rgba(239, 68, 68, 1)';
                ctx.lineWidth = 4;
                ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
                ctx.fill();
                ctx.stroke();
            } else if (cursor.state === 'GRAB') {
                ctx.strokeStyle = 'rgba(34, 197, 94, 1)';
                ctx.lineWidth = 4;
                ctx.fillStyle = 'rgba(34, 197, 94, 0.5)';
                ctx.fill();
                ctx.stroke();
                
                ctx.fillStyle = 'white';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('✔️', 0, 0);
            }
            
            ctx.restore();
        }

        function drawHandLandmarks() {
            if (!handLandmarksDraw) return;
            ctx.save();
            const connections = HAND_CONNECTIONS;
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 2;
            
            connections.forEach(conn => {
                const p1 = handLandmarksDraw[conn[0]];
                const p2 = handLandmarksDraw[conn[1]];
                
                const x1 = (1 - p1.x) * width;
                const y1 = p1.y * height;
                const x2 = (1 - p2.x) * width;
                const y2 = p2.y * height;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            });

            const indexTip = handLandmarksDraw[8];
            const thumbTip = handLandmarksDraw[4];

            let ix = (1 - indexTip.x) * width;
            let iy = indexTip.y * height;
            let tx = (1 - thumbTip.x) * width;
            let ty = thumbTip.y * height;

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(ix, iy, 7, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(tx, ty, 7, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }

        function drawLoop() {
            if (mouseOnlyMode) {
                let grad = ctx.createLinearGradient(0, 0, width, height);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(0.5, '#1e1b4b');
                grad.addColorStop(1, '#311042');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
            } else {
                ctx.clearRect(0, 0, width, height);
            }

            updateAndDrawParticles(ctx);

            let now = Date.now();
            if (currentState !== GameState.START && currentState !== GameState.END) {
                if (!mouseOnlyMode && now - lastHandDetectTime > 2000 && !usingMouse) {
                    handWarning.classList.remove('opacity-0');
                } else {
                    handWarning.classList.add('opacity-0');
                }
            }

            if (currentState === GameState.INSTRUCT) {
                if (instructButton) instructButton.draw(ctx);
            } 
            else if (currentState === GameState.PLAY) {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
                ctx.beginPath();
                let eqBoxWidth = Math.min(width * 0.85, 820);
                let eqBoxHeight = height * 0.2;
                ctx.roundRect(width/2 - eqBoxWidth/2, height * 0.55 - eqBoxHeight/2, eqBoxWidth, eqBoxHeight, 24);
                ctx.fill();
                
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `bold ${Math.min(55, width*0.075)}px Mitr`;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                
                const level = levelData[currentLevel];
                if (level) {
                     let displayText = level.equation.replace('_', '      ');
                     ctx.fillText(displayText, width/2, height * 0.55);
                     
                     ctx.font = `bold ${Math.min(24, width*0.035)}px Mitr`;
                     ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                     ctx.fillText("⬇️ ลากตัวเลขมาวางในช่องว่างด้านล่าง ⬇️", width/2, height * 0.9);
                }
                ctx.restore();

                slots.forEach(slot => slot.draw(ctx));
                cards.forEach(card => card.draw(ctx));
            }

            checkCollisionsAndLogic();

            if (currentState !== GameState.START && currentState !== GameState.END) {
                drawHandLandmarks();
                drawCursor();
            }

            requestAnimationFrame(drawLoop);
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                lastHandDetectTime = Date.now();
                usingMouse = false;
                
                const landmarks = results.multiHandLandmarks[0];
                handLandmarksDraw = landmarks;

                let ix = (1 - landmarks[8].x) * width;
                let iy = landmarks[8].y * height;
                let tx = (1 - landmarks[4].x) * width;
                let ty = landmarks[4].y * height;

                cursor.x += (ix - cursor.x) * 0.5;
                cursor.y += (iy - cursor.y) * 0.5;

                let dx = ix - tx;
                let dy = iy - ty;
                let pinchDistancePixels = Math.sqrt(dx*dx + dy*dy);
                
                const PINCH_THRESHOLD = width * 0.04; 

                if (!isPinching && pinchDistancePixels < PINCH_THRESHOLD) {
                    isPinching = true;
                } else if (isPinching && pinchDistancePixels > PINCH_THRESHOLD * 1.5) {
                    isPinching = false;
                }
            } else {
                handLandmarksDraw = null;
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        function updateMousePos(e) {
            usingMouse = true;
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            cursor.x = clientX;
            cursor.y = clientY;
            handLandmarksDraw = null;
        }

        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('touchmove', updateMousePos, {passive: false});

        function handlePointerDown(e) {
            if (currentState === GameState.START) return;
            if (e.type === 'touchstart') e.preventDefault();
            updateMousePos(e);
            isPinching = true;
        }

        function handlePointerUp() {
            if (currentState === GameState.START) return;
            isPinching = false;
        }

        window.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('touchstart', handlePointerDown, {passive: false});
        window.addEventListener('mouseup', handlePointerUp);
        window.addEventListener('touchend', handlePointerUp);

        startBtn.addEventListener('click', () => {
            selectedMode = 'AR';
            stepModeSelection.classList.add('hidden');
            stepTimerSelection.classList.remove('hidden');
        });

        mouseBtn.addEventListener('click', () => {
            selectedMode = 'MOUSE';
            stepModeSelection.classList.add('hidden');
            stepTimerSelection.classList.remove('hidden');
        });

        document.querySelectorAll('.btn-timer').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let target = e.currentTarget;
                selectedTimerOption = parseInt(target.getAttribute('data-time'));
                stepTimerSelection.classList.add('hidden');
                stepDifficultySelection.classList.remove('hidden');
            });
        });

        function startGameFlow(difficulty) {
            selectedDifficulty = difficulty;
            stepDifficultySelection.classList.add('hidden');
            
            // Generate initial batch of math problems
            levelData = [];
            for(let i = 0; i < maxLevelsPerGame; i++) {
                levelData.push(generateMathProblem(difficulty));
            }

            if (selectedMode === 'AR') {
                loadingText.style.display = 'block';
                camera.start().then(() => {
                    startScreen.style.opacity = '0';
                    setTimeout(() => {
                        startScreen.style.display = 'none';
                        currentState = GameState.INSTRUCT;
                        setupInstructionScreen();
                    }, 500);
                }).catch(err => {
                    loadingText.innerText = "ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตการใช้กล้องแล้วลองใหม่";
                    loadingText.style.animation = 'none';
                    loadingText.style.color = '#ff6b6b';
                    console.error(err);
                });
            } else {
                mouseOnlyMode = true;
                usingMouse = true;
                startScreen.style.opacity = '0';
                document.getElementById('video-container').style.display = 'none';
                setTimeout(() => {
                    startScreen.style.display = 'none';
                    currentState = GameState.INSTRUCT;
                    setupInstructionScreen();
                }, 500);
            }
        }

        function resetToHome() {
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            
            currentLevel = 0;
            score = 0;
            questionsSolved = 0;
            currentCombo = 0;
            maxCombo = 0;
            
            scoreVal.innerText = '0';
            comboContainer.classList.add('hidden');
            
            cards = [];
            slots = [];
            draggedCard = null;
            currentState = GameState.START;

            endScreen.classList.add('hidden');
            uiLayer.classList.add('hidden');
            
            stepModeSelection.classList.remove('hidden');
            stepTimerSelection.classList.add('hidden');
            stepDifficultySelection.classList.add('hidden');
            loadingText.style.display = 'none';
            
            startScreen.style.display = 'flex';
            setTimeout(() => {
                startScreen.style.opacity = '1';
            }, 10);

            document.getElementById('video-container').style.display = 'block';
            mouseOnlyMode = false;
        }

        function restartGame() {
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            
            currentLevel = 0;
            score = 0;
            questionsSolved = 0;
            currentCombo = 0;
            maxCombo = 0;
            
            scoreVal.innerText = '0';
            comboContainer.classList.add('hidden');
            endScreen.classList.add('hidden');
            
            levelData = [];
            for(let i=0; i<maxLevelsPerGame; i++) {
                levelData.push(generateMathProblem(selectedDifficulty));
            }
            
            currentState = GameState.PLAY;
            startTimerLogic();
            loadLevel(currentLevel);
        }

        // Button Event Bindings
        btnReplay.addEventListener('click', restartGame);
        btnHome.addEventListener('click', resetToHome);
        if (btnIngameHome) btnIngameHome.addEventListener('click', resetToHome);

        btnEasy.addEventListener('click', () => startGameFlow('EASY'));
        btnMedium.addEventListener('click', () => startGameFlow('MEDIUM'));
        btnHard.addEventListener('click', () => startGameFlow('HARD'));

        // Start render animation loop
        requestAnimationFrame(drawLoop);

    </script>
</body>
</html>
