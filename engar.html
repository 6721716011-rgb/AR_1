<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngAR - Math Puzzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Mitr', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #1a202c; /* Fallback dark bg */
            touch-action: none; /* Prevent scroll on touch */
        }
        
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror camera */
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        /* Glassmorphism UI Elements overlaying canvas but non-blocking */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Start Screen specific */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto; /* Active for starting */
            transition: opacity 0.5s;
        }
        
        #loading-text {
            display: none;
            color: white;
            margin-top: 1rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- Video Background -->
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Layer (Scores, Prompt, Warnings) -->
    <div id="ui-layer" class="p-6 hidden">
        <div class="flex justify-between items-start">
            <div id="score-board" class="glass-panel text-white px-6 py-3 rounded-2xl text-2xl font-semibold">
                คะแนน: <span id="score-val" class="text-yellow-400">0</span>
            </div>
            
            <div id="hand-warning" class="bg-red-500/80 text-white px-6 py-3 rounded-full font-medium shadow-lg transition-opacity duration-300 opacity-0 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                กำลังหามือของคุณ...
            </div>
        </div>

        <div class="flex justify-center mb-10 mt-auto">
            <div id="question-board" class="glass-panel text-white text-3xl md:text-5xl font-bold px-10 py-4 rounded-3xl shadow-2xl border-b-4 border-white/40">
                <!-- โจทย์จะแสดงที่นี่ -->
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <div class="glass-panel p-12 rounded-3xl text-center max-w-xl w-11/12">
            <h1 class="text-5xl md:text-7xl font-bold text-white mb-4 drop-shadow-lg">MathAR</h1>
            <p class="text-xl text-blue-100 mb-10">เกมเติมคำตอบคณิตศาสตร์ด้วยมือ!</p>
            
            <button id="start-btn" class="bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white text-2xl font-semibold py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95">
                เข้าสู่เกม (Start AR)
            </button>
            <button id="mouse-btn" class="mt-4 block mx-auto bg-white/20 hover:bg-white/30 text-white text-xl font-semibold py-3 px-10 rounded-full shadow-lg transform transition border border-white/40 hover:scale-105 active:scale-95">
                เล่นด้วยเมาส์/นิ้วสัมผัส (No Camera)
            </button>
            <div id="loading-text" class="text-lg mt-4">กำลังเปิดกล้องและ AI...</div>
        </div>
    </div>

    <script>
        // DOM Elements
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('webcam');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const mouseBtn = document.getElementById('mouse-btn');
        const loadingText = document.getElementById('loading-text');
        const uiLayer = document.getElementById('ui-layer');
        const scoreVal = document.getElementById('score-val');
        const questionBoard = document.getElementById('question-board');
        const handWarning = document.getElementById('hand-warning');

        // Game State Enum
        const GameState = {
            START: 'START',
            INSTRUCT: 'INSTRUCT',
            PLAY: 'PLAY',
            END: 'END'
        };
        let currentState = GameState.START;

        // Display Variables
        let width, height;
        
        // Input Variables (Mouse/Touch fallback + AR)
        let cursor = { x: 0, y: 0, state: 'NORMAL' }; // States: NORMAL, HOVER, MISS, GRAB
        let isPinching = false;
        let lastHandDetectTime = 0;
        let usingMouse = false;
        let mouseOnlyMode = false;
        let handLandmarksDraw = null; // Store for drawing skeleton

        // Game Data
        let currentLevel = 0;
        let score = 0;
        
        const levelData = [
            { 
                equation: "2 + _ = 5", 
                slots: ["3"],
                choices: [
                    { id: "3", emoji: "🍎" },
                    { id: "4", emoji: "🍌" },
                    { id: "2", emoji: "🍇" }
                ]
            },
            { 
                equation: "_ - 4 = 6", 
                slots: ["10"],
                choices: [
                    { id: "10", emoji: "🌟" },
                    { id: "8", emoji: "🌙" },
                    { id: "9", emoji: "☀️" }
                ]
            },
            { 
                equation: "3 x _ = 12", 
                slots: ["4"],
                choices: [
                    { id: "5", emoji: "🚗" },
                    { id: "4", emoji: "🚕" },
                    { id: "6", emoji: "🚙" }
                ]
            },
            { 
                equation: "15 ÷ _ = 3", 
                slots: ["5"],
                choices: [
                    { id: "4", emoji: "🐶" },
                    { id: "5", emoji: "🐱" },
                    { id: "6", emoji: "🐭" }
                ]
            },
            { 
                equation: "7 + 8 = _", 
                slots: ["15"],
                choices: [
                    { id: "14", emoji: "🍔" },
                    { id: "16", emoji: "🍕" },
                    { id: "15", emoji: "🌭" }
                ]
            },
            { 
                equation: "_ x 5 = 25", 
                slots: ["5"],
                choices: [
                    { id: "5", emoji: "⚽" },
                    { id: "6", emoji: "🏀" },
                    { id: "4", emoji: "🏈" }
                ]
            },
            { 
                equation: "20 - _ = 11", 
                slots: ["9"],
                choices: [
                    { id: "8", emoji: "🎸" },
                    { id: "9", emoji: "🎹" },
                    { id: "10", emoji: "🥁" }
                ]
            },
            { 
                equation: "4 x 4 = _", 
                slots: ["16"],
                choices: [
                    { id: "16", emoji: "🚀" },
                    { id: "12", emoji: "🛸" },
                    { id: "18", emoji: "🚁" }
                ]
            },
            { 
                equation: "18 ÷ 2 = _", 
                slots: ["9"],
                choices: [
                    { id: "8", emoji: "🌈" },
                    { id: "9", emoji: "🌧️" },
                    { id: "10", emoji: "❄️" }
                ]
            },
            { 
                equation: "_ + 12 = 30", 
                slots: ["18"],
                choices: [
                    { id: "17", emoji: "📚" },
                    { id: "18", emoji: "✏️" },
                    { id: "19", emoji: "🎒" }
                ]
            }
        ];

        // Entities
        let cards = [];
        let slots = [];
        let draggedCard = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // Custom UI buttons drawn on Canvas
        let instructButton = null;

        class Card {
            constructor(wordObj, x, y, size) {
                this.word = wordObj.id;
                this.emoji = wordObj.emoji;
                this.x = x;
                this.y = y;
                this.width = size * 1.2;
                this.height = size * 1.5;
                this.isDragging = false;
                this.currentSlot = null;
                
                // For smooth animations
                this.targetX = x;
                this.targetY = y;
            }

            draw(ctx) {
                // Update physics slightly (lerp to target if not dragging)
                if (!this.isDragging) {
                    this.x += (this.targetX - this.x) * 0.2;
                    this.y += (this.targetY - this.y) * 0.2;
                }

                // Shadow (2.5D effect)
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = this.isDragging ? 20 : 10;
                ctx.shadowOffsetX = this.isDragging ? 5 : 2;
                ctx.shadowOffsetY = this.isDragging ? 15 : 5;
                
                // Card Background (Glass effect + solid base)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                if (this.isDragging) ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                
                // Draw rounded rect
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 16);
                ctx.fill();
                
                // Border
                ctx.strokeStyle = 'rgba(255, 255, 255, 1)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                // Draw Emoji
                ctx.font = `${this.width * 0.4}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y - this.height * 0.15);

                // Draw Text
                ctx.fillStyle = '#333';
                ctx.font = `600 ${this.width * 0.2}px Mitr`;
                ctx.fillText(this.word, this.x, this.y + this.height * 0.25);
            }

            isPointInside(px, py) {
                return px >= this.x - this.width/2 && px <= this.x + this.width/2 &&
                       py >= this.y - this.height/2 && py <= this.y + this.height/2;
            }
        }

        class Slot {
            constructor(expectedWord, x, y, width, height) {
                this.expectedWord = expectedWord;
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.card = null; // Card currently in this slot
            }

            draw(ctx) {
                ctx.save();
                ctx.setLineDash([10, 10]);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 3;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 16);
                ctx.fill();
                ctx.stroke();
                
                ctx.restore();
            }
            
            drawEquationParts(ctx) {
                // If this is part of the main equation display, we'll handle that separately
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            width = canvas.width;
            height = canvas.height;
            
            // Re-center UI elements if needed based on state
            if (currentState === GameState.INSTRUCT) {
                setupInstructionScreen();
            } else if (currentState === GameState.PLAY) {
                // Appropriate layout recalculation for math game
                let slotTotalWidth = slots.length * (width * 0.15) + (slots.length - 1) * 20;
                let startX = (width - slotTotalWidth) / 2 + (width * 0.15)/2;
                // slots are positioned dynamically based on equation now, so this generic resize might need tweaks
                // For simplicity, we just reposition slots generally in the center bottom
                slots.forEach((s, idx) => {
                    s.x = width / 2; // Center it for single slot math equations
                    s.y = height * 0.75;
                    s.width = width * 0.15;
                    s.height = width * 0.15 * 1.5;
                    
                    if (s.card) {
                        s.card.targetX = s.x;
                        s.card.targetY = s.y;
                    }
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function setupInstructionScreen() {
            let btnWidth = Math.min(300, width * 0.5);
            let btnHeight = 80;
            instructButton = {
                x: width / 2,
                y: height / 2 + 100,
                width: btnWidth,
                height: btnHeight,
                isHover: false,
                draw: function(ctx) {
                    ctx.save();
                    // Draw Instructions Text
                    ctx.fillStyle = 'white';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Box background for text
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    ctx.beginPath();
                    ctx.roundRect(width/2 - Math.min(400, width*0.45), height/2 - 200, Math.min(800, width*0.9), 250, 20);
                    ctx.fill();

                    ctx.fillStyle = 'white';
                    ctx.font = `bold ${Math.min(36, width*0.04)}px Mitr`;
                    ctx.fillText("วิธีเล่น (How to Play)", width/2, height/2 - 150);
                    
                    ctx.font = `${Math.min(24, width*0.03)}px Mitr`;
                    ctx.fillText("👌 ใช้มือ 'จีบนิ้ว' (นิ้วโป้งแตะนิ้วชี้) เพื่อหยิบคำศัพท์", width/2, height/2 - 90);
                    ctx.fillText("🖐️ 'กางนิ้ว' เพื่อปล่อยคำศัพท์ลงในช่องว่าง", width/2, height/2 - 50);
                    ctx.fillText("🖱️ สามารถใช้เมาส์ หรือ ทัชสกรีน ลากแทนได้", width/2, height/2 - 10);
                    
                    // Draw Button
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 15;
                    ctx.shadowOffsetY = 5;
                    
                    ctx.fillStyle = this.isHover ? '#22c55e' : '#16a34a'; // Tailwind green
                    ctx.beginPath();
                    ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 40);
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.font = `bold ${Math.min(32, width*0.04)}px Mitr`;
                    ctx.shadowColor = 'transparent';
                    ctx.fillText("เริ่มเกม!", this.x, this.y);
                    
                    ctx.restore();
                },
                isPointInside: function(px, py) {
                    return px >= this.x - this.width/2 && px <= this.x + this.width/2 &&
                           py >= this.y - this.height/2 && py <= this.y + this.height/2;
                }
            };
        }

        function loadLevel(levelIdx) {
            cards = [];
            slots = [];
            draggedCard = null;
            
            const level = levelData[levelIdx];
            
            // We'll draw the equation on the canvas instead of using HTML for better integration
            questionBoard.innerText = `ด่าน ${levelIdx + 1}: เติมคำตอบให้ถูกต้อง`;
            questionBoard.classList.remove('hidden');
            
            let cardSize = Math.min(width * 0.15, 150);

            // Create Slot for the answer (usually just 1 for these math problems)
            // Position it centrally
            level.slots.forEach((expectedAnswer, i) => {
                slots.push(new Slot(expectedAnswer, width / 2, height * 0.75, cardSize, cardSize * 1.5));
            });

            // Create Cards for choices (random positions top half)
            let shuffledChoices = [...level.choices].sort(() => Math.random() - 0.5);
            
            // Distribute choices evenly across the top
            let choiceSpacing = width / (shuffledChoices.length + 1);
            
            shuffledChoices.forEach((choice, i) => {
                let randX = choiceSpacing * (i + 1);
                let randY = height * 0.3 + (Math.random() * 50 - 25); // Top 30% area with slight variation
                
                let card = new Card(choice, randX, randY, cardSize * 0.8);
                cards.push(card);
            });
        }

        function checkCollisionsAndLogic() {
            // Determine cursor state & interactions based on current state
            if (currentState === GameState.INSTRUCT && instructButton) {
                let hoverBtn = instructButton.isPointInside(cursor.x, cursor.y);
                instructButton.isHover = hoverBtn;
                
                if (hoverBtn) {
                    cursor.state = isPinching ? 'GRAB' : 'HOVER';
                    if (isPinching) {
                        // Action: Start Game
                        isPinching = false; // Reset to avoid double trigger
                        currentState = GameState.PLAY;
                        uiLayer.style.pointerEvents = 'none'; // ensure
                        uiLayer.classList.remove('hidden');
                        loadLevel(currentLevel);
                    }
                } else {
                    cursor.state = isPinching ? 'MISS' : 'NORMAL';
                }
                return;
            }

            if (currentState === GameState.PLAY) {
                // Drag Logic
                if (isPinching) {
                    if (draggedCard) {
                        // Continue Dragging
                        cursor.state = 'GRAB';
                        draggedCard.targetX = cursor.x + dragOffsetX;
                        draggedCard.targetY = cursor.y + dragOffsetY;
                        
                        // Clear current slot if dragged out
                        if (draggedCard.currentSlot) {
                            draggedCard.currentSlot.card = null;
                            draggedCard.currentSlot = null;
                        }
                    } else {
                        // Attempt to grab
                        let found = false;
                        // Iterate backwards to grab top-most card
                        for (let i = cards.length - 1; i >= 0; i--) {
                            let c = cards[i];
                            if (c.isPointInside(cursor.x, cursor.y)) {
                                draggedCard = c;
                                draggedCard.isDragging = true;
                                dragOffsetX = c.x - cursor.x;
                                dragOffsetY = c.y - cursor.y;
                                cursor.state = 'GRAB';
                                found = true;
                                // Move card to top of array
                                cards.splice(i, 1);
                                cards.push(draggedCard);
                                break;
                            }
                        }
                        if (!found) cursor.state = 'MISS';
                    }
                } else {
                    // Not pinching
                    if (draggedCard) {
                        // Dropped a card
                        draggedCard.isDragging = false;
                        
                        let snapped = false;
                        for (let slot of slots) {
                            // Hitbox detection for drop (generous)
                            if (!slot.card && 
                                Math.abs(draggedCard.x - slot.x) < slot.width && 
                                Math.abs(draggedCard.y - slot.y) < slot.height) {
                                
                                draggedCard.targetX = slot.x;
                                draggedCard.targetY = slot.y;
                                draggedCard.currentSlot = slot;
                                slot.card = draggedCard;
                                snapped = true;
                                break;
                            }
                        }
                        
                        draggedCard = null;
                        
                        // Check win condition if a card was snapped
                        if(snapped) {
                             setTimeout(checkWinCondition, 300); // slight delay to let it snap visually
                        }
                    }
                    
                    // Check Hover state
                    let hoveringCard = cards.find(c => c.isPointInside(cursor.x, cursor.y));
                    cursor.state = hoveringCard ? 'HOVER' : 'NORMAL';
                }
            }
        }

        function checkWinCondition() {
            // Check if all slots are filled
            let isFull = slots.every(s => s.card !== null);
            if (!isFull) return;

            // Check if correct answer
            let isCorrect = slots.every(s => s.card && s.card.word === s.expectedWord);

            if (isCorrect) {
                score += 100;
                scoreVal.innerText = score;
                
                // Show celebration visual immediately on cards
                slots.forEach(s => s.card.emoji = "✅");

                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel < levelData.length) {
                        loadLevel(currentLevel);
                    } else {
                        currentState = GameState.END;
                        questionBoard.innerText = "เก่งมาก! เคลียร์ทุกด่านแล้ว 🎉";
                    }
                }, 1500);
            } else {
                // Shake incorrect cards and reset them
                slots.forEach(s => {
                    if (s.card && s.card.word !== s.expectedWord) {
                        // Pop out incorrect answer
                        let c = s.card;
                        s.card = null;
                        c.currentSlot = null;
                        c.targetY = height * 0.3; // Send it back to the top area
                        c.emoji = "❌";
                        setTimeout(() => {
                            // Restore original emoji
                            let originalChoice = levelData[currentLevel].choices.find(ch => ch.id === c.word);
                            if(originalChoice) c.emoji = originalChoice.emoji;
                        }, 1000);
                    }
                });
            }
        }

        function drawCursor() {
            ctx.save();
            ctx.translate(cursor.x, cursor.y);
            
            // Outer Ring
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            
            if (cursor.state === 'NORMAL') {
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.8)'; // Blue
                ctx.lineWidth = 3;
                ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
                ctx.fill();
                ctx.stroke();
            } else if (cursor.state === 'HOVER') {
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = 'rgba(234, 179, 8, 1)'; // Yellow
                ctx.lineWidth = 3;
                ctx.fillStyle = 'rgba(234, 179, 8, 0.2)';
                ctx.fill();
                ctx.stroke();
            } else if (cursor.state === 'MISS') {
                ctx.strokeStyle = 'rgba(239, 68, 68, 1)'; // Red
                ctx.lineWidth = 4;
                ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
                ctx.fill();
                ctx.stroke();
            } else if (cursor.state === 'GRAB') {
                ctx.strokeStyle = 'rgba(34, 197, 94, 1)'; // Green
                ctx.lineWidth = 4;
                ctx.fillStyle = 'rgba(34, 197, 94, 0.5)';
                ctx.fill();
                ctx.stroke();
                
                // Draw tick ✔️
                ctx.fillStyle = 'white';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('✔️', 0, 0);
            }
            
            ctx.restore();
        }

        function drawHandLandmarks() {
            if (!handLandmarksDraw) return;
            ctx.save();
            // We draw custom skeleton to map mirrored coordinates correctly
            const connections = HAND_CONNECTIONS; // Provided by MediaPipe Drawing Utils globally
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            
            // Draw connections
            connections.forEach(conn => {
                const p1 = handLandmarksDraw[conn[0]];
                const p2 = handLandmarksDraw[conn[1]];
                
                // Mirror X
                const x1 = (1 - p1.x) * width;
                const y1 = p1.y * height;
                const x2 = (1 - p2.x) * width;
                const y2 = p2.y * height;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            });

            // Draw specific joints (Thumb and Index)
            const indexTip = handLandmarksDraw[8];
            const thumbTip = handLandmarksDraw[4];

            let ix = (1 - indexTip.x) * width;
            let iy = indexTip.y * height;
            let tx = (1 - thumbTip.x) * width;
            let ty = thumbTip.y * height;

            ctx.fillStyle = '#60a5fa'; // Tailwind blue 400
            ctx.beginPath(); ctx.arc(ix, iy, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(tx, ty, 6, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }

        function drawLoop() {
            if (mouseOnlyMode) {
                let grad = ctx.createLinearGradient(0, 0, width, height);
                grad.addColorStop(0, '#1e3a8a'); // blue-900
                grad.addColorStop(1, '#581c87'); // purple-900
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
            } else {
                ctx.clearRect(0, 0, width, height);
            }

            let now = Date.now();
            if (currentState !== GameState.START && currentState !== GameState.END) {
                if (!mouseOnlyMode && now - lastHandDetectTime > 2000 && !usingMouse) {
                    handWarning.classList.remove('opacity-0');
                } else {
                    handWarning.classList.add('opacity-0');
                }
            }

            if (currentState === GameState.INSTRUCT) {
                if (instructButton) instructButton.draw(ctx);
            } 
            else if (currentState === GameState.PLAY) {
                
                // Draw the Math Equation Background
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                let eqBoxWidth = Math.min(width * 0.8, 800);
                let eqBoxHeight = height * 0.2;
                ctx.roundRect(width/2 - eqBoxWidth/2, height * 0.55 - eqBoxHeight/2, eqBoxWidth, eqBoxHeight, 20);
                ctx.fill();
                
                // Draw Equation Text
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `bold ${Math.min(60, width*0.08)}px Mitr`;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                
                const level = levelData[currentLevel];
                if(level) {
                     // Replace underscore with spaces to leave room for the slot
                     let displayText = level.equation.replace('_', '      ');
                     ctx.fillText(displayText, width/2, height * 0.55);
                     
                     // Draw an arrow pointing to the slot
                     ctx.font = `bold ${Math.min(40, width*0.05)}px Mitr`;
                     ctx.fillText("⬇️ ลากคำตอบมาวางที่นี่ ⬇️", width/2, height * 0.9);
                }
                ctx.restore();

                // Draw Slots
                slots.forEach(slot => slot.draw(ctx));
                // Draw Cards
                cards.forEach(card => card.draw(ctx));
            }
            else if (currentState === GameState.END) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.font = `bold ${width * 0.08}px Mitr`;
                ctx.fillText("All Clear! 🎉", width/2, height/2);
                ctx.font = `${width * 0.04}px Mitr`;
                ctx.fillText(`คะแนนรวม: ${score}`, width/2, height/2 + 80);
            }

            checkCollisionsAndLogic();

            if (currentState !== GameState.START) {
                drawHandLandmarks();
                drawCursor();
            }

            requestAnimationFrame(drawLoop);
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                lastHandDetectTime = Date.now();
                usingMouse = false;
                
                const landmarks = results.multiHandLandmarks[0];
                handLandmarksDraw = landmarks; // Save for drawing

                // Index finger tip (Landmark 8) mapped for mirrored camera
                let ix = (1 - landmarks[8].x) * width;
                let iy = landmarks[8].y * height;
                
                // Thumb tip (Landmark 4)
                let tx = (1 - landmarks[4].x) * width;
                let ty = landmarks[4].y * height;

                // Update cursor position to index tip
                // Smooth interpolation for stability
                cursor.x += (ix - cursor.x) * 0.5;
                cursor.y += (iy - cursor.y) * 0.5;

                // Calculate pinch distance using Pythagorean theorem (Requested format)
                let dx = ix - tx;
                let dy = iy - ty;
                let pinchDistancePixels = Math.sqrt(dx*dx + dy*dy);
                
                // Pinch threshold (relative to screen width)
                const PINCH_THRESHOLD = width * 0.04; 

                // Hysteresis to prevent flickering
                if (!isPinching && pinchDistancePixels < PINCH_THRESHOLD) {
                    isPinching = true;
                } else if (isPinching && pinchDistancePixels > PINCH_THRESHOLD * 1.5) {
                    isPinching = false;
                }
            } else {
                handLandmarksDraw = null;
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        function updateMousePos(e) {
            usingMouse = true;
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            cursor.x = clientX;
            cursor.y = clientY;
            handLandmarksDraw = null; // Hide skeleton if using mouse
        }

        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('touchmove', updateMousePos, {passive: false});

        function handlePointerDown(e) {
            if (currentState === GameState.START) return;
            if (e.type === 'touchstart') e.preventDefault(); // Prevent scroll/zoom
            updateMousePos(e);
            isPinching = true;
        }

        function handlePointerUp() {
            if (currentState === GameState.START) return;
            isPinching = false;
        }

        window.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('touchstart', handlePointerDown, {passive: false});
        window.addEventListener('mouseup', handlePointerUp);
        window.addEventListener('touchend', handlePointerUp);

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            mouseBtn.style.display = 'none';
            loadingText.style.display = 'block';
            
            // Start Camera
            camera.start().then(() => {
                startScreen.style.opacity = '0';
                setTimeout(() => {
                    startScreen.style.display = 'none';
                    currentState = GameState.INSTRUCT;
                    setupInstructionScreen();
                }, 500);
            }).catch(err => {
                loadingText.innerText = "ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตการใช้กล้อง";
                loadingText.style.animation = 'none';
                loadingText.style.color = 'red';
                console.error(err);
            });
        });

        mouseBtn.addEventListener('click', () => {
            mouseOnlyMode = true;
            usingMouse = true;
            startScreen.style.opacity = '0';
            document.getElementById('video-container').style.display = 'none'; // Hide video background
            setTimeout(() => {
                startScreen.style.display = 'none';
                currentState = GameState.INSTRUCT;
                setupInstructionScreen();
            }, 500);
        });

        // Start render loop
        requestAnimationFrame(drawLoop);

    </script>
</body>
</html>
